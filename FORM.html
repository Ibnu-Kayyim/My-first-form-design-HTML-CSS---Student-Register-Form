<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
  <style>
    * {
    box-sizing: border-box;
}
    body {
      background-color: burlywood;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    form {
      position: relative;
      background-image: url(formbg.jpeg);
      background-size: cover;
      background-position: center;
      width: 100%;
      padding: 30px;
      color: white;
    }
    form::before {
      content: "";
      inset: 0;
      position: absolute;
      background-color: rgba(0, 0, 0, 0.5);
    }
    form > * {
    position: relative;
    z-index: 1;
}
    fieldset {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .text {
      height: 35px;
      border: none;
      border-radius: 8px;
      padding: 4px 10px;
    }
    .text:focus {
  border-color: red;
  outline: none;
}
    .option {
    display: flex;
    align-items: center;
    gap: 8px;
    }
    input[type="checkbox"]:checked,
input[type="radio"]:checked {
    accent-color: #c40404;
}
    select {
      background-color: brown;
      color: white;
      height: 30px;
      padding: 4px 10px;
      border-radius: 8px;
      border: none;
    }
    textarea {
      height: 30px;
      padding: 4px 10px;
      border-radius: 8px;
    }
    button {
      background-color: brown;
      color: white;
      border: none;
      border-radius: 15px;
      padding: 10px;
      font-size: large;
      transition: background-color 0.5s;
    
    }
    button:hover {
      background-color: red;
    }
  </style>
</head>
<body>
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row justify-content">
        <div class="col-12 col-md-8 col-ld-6">
            <form action="/register" method="post" autocomplete="on">
    <h1 class="text-center fw-bold">STUDENT REGISTRATION FORM</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Full Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Abdulkadir Abdallah Aliyu"
            required
            class="text"
        >
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="abdallah@gmail.com"
            required
            class="text"
        >
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            maxlength="11"
            required
            class="text"
        >
        <label for="age">Age:</label>
        <input
            type="number"
            id="age"
            name="age"
            min="1"
            max="100"
            required
            class="text"
        >
        <label>Gender:</label>
        <label class="option">
            <input type="radio" id="male" name="gender" value="male">
            Male
        </label>
        <label class="option">
            <input type="radio" id="female" name="gender" value="female">
            Female
        </label>
        <label for="department" class="option">Department:</label>
        <select id="department" name="department">
            <option value="it">Information Technology</option>
            <option value="cs">Computer Science</option>
            <option value="se">Software Engineering</option>
        </select>
        <label>
            <input type="checkbox" name="service" value="html">
            HTML
        </label>
        <label>
            <input type="checkbox" name="service" value="css">
            CSS
        </label>
        <label>
            <input type="checkbox" name="service" value="graphic-design">
            Graphic Design
        </label>
        <label>
            <input type="checkbox" name="service" value="ui-ux">
            UI/UX
        </label>
        <label for="message">About yourself:</label>
        <textarea
            id="message"
            name="message"
            placeholder="Write about yourself"
        ></textarea>
        <button class="btn-primary" type="submit">Submit</button>
    </fieldset>
</form>
        </div>
    </div>
</div>  
</body>
</html>
